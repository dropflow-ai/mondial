name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          sw_vers

      - name: Build app and CLI
        run: ./build.sh

      - name: Show bundle
        run: |
          ls -la dist
          codesign -dv dist/MonDial.app 2>&1 | head -5 || true

      - name: Smoke test CLI
        run: |
          ./dist/mondialctl --version
          ./dist/mondialctl list || true
          ./dist/mondialctl doctor || true

      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MonDial.app MonDial-app.zip
          zip -r MonDial-cli.zip mondialctl

      - uses: actions/upload-artifact@v4
        with:
          name: MonDial
          path: |
            dist/MonDial-app.zip
            dist/MonDial-cli.zip
          if-no-files-found: error
